<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="lihiDomain 網域搜尋結果頁三種設計提案">
  <title>lihiDomain 搜尋結果頁｜三種設計提案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="hub-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="lihiDomain 設計提案首頁">
      <img src="https://assets.lihi.io/logo-svg" alt="lihi">
      <span>Domain Lab</span>
    </a>
    <span class="prototype-badge">UX Prototype</span>
  </header>

  <main class="hub-main">
    <section class="hub-intro">
      <p class="eyebrow">lihiDomain · Search Result Redesign</p>
      <h1>同一個搜尋結果，<br>三種不同的購買理由。</h1>
      <p class="hub-lead">三版共用相同資料與操作，分別測試「立即擁有、實際用途、品牌保護」哪一種訊息最能推動註冊。</p>
      <form class="hub-search" data-search-form>
        <label for="hub-domain">測試你想搜尋的網域</label>
        <div class="search-control">
          <input id="hub-domain" name="domain" value="werwerasfsf.com" autocomplete="off" spellcheck="false" aria-describedby="hub-hint">
          <button type="submit">套用到三個版本</button>
        </div>
        <p id="hub-hint">輸入完整網域，例如 yourbrand.com</p>
      </form>
    </section>

    <section class="version-list" aria-label="三種設計版本">
      <a class="version-row version-a" href="version-a.html?domain=werwerasfsf.com" data-version-link>
        <span class="version-index">A</span>
        <span class="version-copy"><strong>立即轉換</strong><small>用清楚、喜悅的成功狀態，把使用者直接帶到註冊。</small></span>
        <span class="version-tag">Conversion</span><span class="arrow">↗</span>
      </a>
      <a class="version-row version-c" href="version-c.html?domain=werwerasfsf.com" data-version-link>
        <span class="version-index">C</span>
        <span class="version-copy"><strong>用途導向</strong><small>先讓使用者看見官網、信箱、社群入口等實際用途。</small></span>
        <span class="version-tag">Education</span><span class="arrow">↗</span>
      </a>
      <a class="version-row version-d" href="version-d.html?domain=werwerasfsf.com" data-version-link>
        <span class="version-index">D</span>
        <span class="version-copy"><strong>品牌保護</strong><small>以主網域為核心，帶出常見後綴與防冒用的組合需求。</small></span>
        <span class="version-tag">Bundle</span><span class="arrow">↗</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">靜態 UX 原型 · 價格與可用狀態皆為示意</footer>
  <script src="app.js"></script>
</body>
</html>
