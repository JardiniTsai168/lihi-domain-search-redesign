<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>版本 D｜品牌保護｜lihiDomain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body class="result-page page-d">
  <header class="site-header"><a class="brand" href="index.html"><img src="https://assets.lihi.io/logo-svg" alt="lihi"><span>Domain</span></a><nav class="result-nav"><span class="version-pill">Version D · Protection</span><a class="back-link" href="index.html">四版比較</a></nav></header>
  <main class="d-main">
    <form class="result-search d-search" data-search-form><label for="d-domain">搜尋網域</label><div class="search-control"><input id="d-domain" name="domain" data-domain-value spellcheck="false"><button type="submit">重新搜尋</button></div></form>
    <section class="d-heading"><div><div class="status">主網域目前可以註冊</div><h1>保留 <span class="domain-name" data-domain></span>，也保護你的品牌入口。</h1></div><p>主網域是品牌核心；常見後綴能降低仿冒、誤植與顧客走錯網站的風險。</p></section>
    <section class="d-workspace">
      <div class="domain-table" aria-label="可註冊網域">
        <label class="domain-row is-primary"><input type="checkbox" checked data-bundle-checkbox><span><strong data-domain></strong><small>主要品牌網域 · 建議優先註冊</small></span><span class="availability">可以註冊</span><span class="row-price">NT$ 399</span></label>
        <label class="domain-row"><input type="checkbox" data-bundle-checkbox><span><strong data-suggestion></strong><small>台灣市場入口</small></span><span class="availability">可以註冊</span><span class="row-price">NT$ 399</span></label>
        <label class="domain-row"><input type="checkbox" data-bundle-checkbox><span><strong data-suggestion></strong><small>公司與商業識別</small></span><span class="availability">可以註冊</span><span class="row-price">NT$ 399</span></label>
        <label class="domain-row"><input type="checkbox" data-bundle-checkbox><span><strong data-suggestion></strong><small>品牌縮寫與國際用途</small></span><span class="availability">可以註冊</span><span class="row-price">NT$ 399</span></label>
      </div>
      <aside class="d-summary"><h2>你的註冊組合</h2><div class="summary-line"><span>已選擇</span><strong data-bundle-count>1 個網域</strong></div><div class="summary-line"><span>首年合計</span><strong data-bundle-total>NT$ 399</strong></div><button class="primary-btn" data-register type="button">註冊選取的網域</button><p>續約價格會在結帳前清楚列出；你可以隨時調整選取項目。</p></aside>
    </section>
  </main>
  <footer class="site-footer">版本 D · 從單一網域延伸品牌防護與組合購買</footer><script src="app.js"></script>
